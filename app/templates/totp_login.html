{% extends "base.html" %}
{% block title %}Authenticator check · On Track{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">Second step</p><h1>Authenticator check</h1><p class="lede">Enter the current six-digit code from your authenticator app.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/login/totp" class="stack"><input type="hidden" name="challenge_id" value="{{ challenge_id }}"><input type="hidden" name="next" value="{{ next }}"><label>Code<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required autofocus></label><button>Verify & sign in</button></form></section>{% endblock %}
