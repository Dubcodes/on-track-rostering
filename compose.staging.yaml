name: on-track-rostering-staging
services:
  staging_db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-ontrack_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-ontrack_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set a staging-only database password}
      TZ: ${TZ:-Pacific/Auckland}
    volumes:
      - ontrack_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ontrack_staging_internal]

  staging_app:
    build:
      context: .
      args:
        BUILD_ID: ${STAGING_ONTRACK_BUILD_ID:?Set the exact qualified Git SHA}
    restart: unless-stopped
    environment:
      ONTRACK_DATABASE_URL: postgresql+psycopg://${STAGING_POSTGRES_USER:-ontrack_staging}:${STAGING_POSTGRES_PASSWORD}@staging_db:5432/${STAGING_POSTGRES_DB:-ontrack_staging}
      ONTRACK_SECRET_KEY: ${STAGING_ONTRACK_SECRET_KEY:?Set a staging-only 32+ character secret}
      ONTRACK_CREDENTIAL_PEPPER: ${STAGING_ONTRACK_CREDENTIAL_PEPPER:?Set a separate staging-only pepper}
      ONTRACK_COOKIE_SECURE: "true"
      ONTRACK_ALLOWED_HOSTS: ${STAGING_ONTRACK_ALLOWED_HOSTS:?Set the staging hostname}
      ONTRACK_TRUSTED_PROXY_CIDRS: ${STAGING_ONTRACK_TRUSTED_PROXY_CIDRS:?Set the staging proxy CIDRs}
      ONTRACK_WEBAUTHN_RP_ID: ${STAGING_ONTRACK_WEBAUTHN_RP_ID:?Set the staging RP ID}
      ONTRACK_WEBAUTHN_ORIGIN: ${STAGING_ONTRACK_WEBAUTHN_ORIGIN:?Set the exact staging HTTPS origin}
      TZ: ${TZ:-Pacific/Auckland}
    ports:
      - "${STAGING_ONTRACK_HOST_PORT:-18080}:8000"
    depends_on:
      staging_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ontrack_staging_internal]

networks:
  ontrack_staging_internal:
    name: ontrack_staging_internal

volumes:
  ontrack_staging_postgres_data:
    name: ontrack_staging_postgres_data
