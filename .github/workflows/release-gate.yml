name: release-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: ontrack_test
          POSTGRES_USER: ontrack
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontrack -d ontrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ontrack:ci-only-password@127.0.0.1:5432/ontrack_test
      ONTRACK_TEST_DATABASE_URL: postgresql+psycopg://ontrack:ci-only-password@127.0.0.1:5432/ontrack_test
      ONTRACK_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      ONTRACK_CREDENTIAL_PEPPER: ci-only-separate-pepper
      POSTGRES_DB: ontrack
      POSTGRES_USER: ontrack
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/release_gate.py
      - run: docker compose config --quiet
      - run: docker build --build-arg BUILD_ID="$GITHUB_SHA" -t ontrack-rostering:ci .
